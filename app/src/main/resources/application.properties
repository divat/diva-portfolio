spring.application.name=app

# -----------------------
# Datasource settings
# -----------------------
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5433/ecommerce}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/exp-track?currentSchema=public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------
# JPA / Hibernate settings
# -----------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# This ensures Hibernate sessions use the correct timezone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optional: prevent Hibernate from failing if database timezone differs
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

#Actuator config

# Expose only required endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans

# Show details of health endpoint
management.endpoint.health.show-details=always