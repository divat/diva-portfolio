spring.application.name=expense-tracker

# -----------------------
# JPA / Hibernate settings
# -----------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#Actuator config
# Expose only required endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans

# Show details of health endpoint
management.endpoint.health.show-details=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/exp-track-db?currentSchema=public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver





